<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Login | MedVault</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/patient.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="../assets/logo.jpg" class="logo">
            <span>MedVault</span>
        </a>
    </div>
</nav>

<div class="container login-container">
    <div class="row align-items-center">

        <div class="col-lg-6 left-side">
            <h1>Your Health,<br>Protected.</h1>

            <p>
                Securely access appointments, prescriptions,
                medical records, and lab reports anytime.
            </p>

            <div class="feature">
                <i class="fa-solid fa-lock"></i>
                AES Encrypted Records
            </div>

            <div class="feature">
                <i class="fa-solid fa-calendar-check"></i>
                Book Appointments
            </div>

            <div class="feature">
                <i class="fa-solid fa-file-medical"></i>
                View Medical History
            </div>
        </div>

        <div class="col-lg-6">

            <div class="login-card">

                <h2>Patient Login</h2>

                <p class="text-secondary mb-4">
                    Sign in to continue
                </p>

                <form id="loginForm">

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fa-solid fa-envelope"></i>
                            </span>
                            <input type="email" class="form-control" placeholder="example@email.com" required id="email">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" class="form-control" placeholder="Password" required id="password">
                        </div>
                    </div>

                    <button class="btn btn-primary w-100 btn-lg" id="loginButton">
                        Sign In
                    </button>

                </form>

                <div class="text-center mt-4">

                    <a href="#" class="forgot">
                        Forgot Password?
                    </a>

                    <hr>

                    <p class="mb-0">
                        Don't have an account?
                        <a href="patient_register.html" class="register">
                            Register
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/login.js"></script>
</body>
</html>
