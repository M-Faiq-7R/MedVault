<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration | MedVault</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/register.css">
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
            <img src="../assets/logo.jpg" class="logo">
            <span>MedVault</span>
        </a>
    </div>
</nav>

<div class="container register-container">
    <div class="register-card">

        <h2>Create Patient Account</h2>
        <p class="text-secondary mb-4">
            Register to securely access your medical records.
        </p>

        <form>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control" placeholder="Alex">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control" placeholder="Davis">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="example@email.com">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" placeholder="+92 300 1234567">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">CNIC</label>
                    <input type="text" class="form-control" placeholder="00000-0000000-0">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" class="form-control">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" placeholder="Password">
                </div>

                <div class="col-md-6 mb-4">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" placeholder="Confirm Password">
                </div>

            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terms">
                <label class="form-check-label" for="terms">
                    I agree to the Terms of Service and Privacy Policy.
                </label>
            </div>

            <button class="btn btn-primary w-100 btn-lg">
                Create Account
            </button>

        </form>

        <hr>

        <p class="text-center mb-0">
            Already have an account?
            <a href="patient_login.html" class="login-link">
                Sign In
            </a>
        </p>

    </div>
</div>

</body>
</html>
